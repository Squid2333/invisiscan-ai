syntax = "proto3";

package invisiscan.v1;

option go_package = "github.com/Squid2333/invisiscan-ai/gen/go/invisiscan/v1;invisiscanv1";

// Image 在 Go 和 Python 服务之间传递一张图像。
message Image {
  enum Encoding {
    ENCODING_UNSPECIFIED = 0;
    // 采用紧密排列的 BGR24 格式，按行存储，无填充。必须提供 width 和 height。
    ENCODING_RAW_BGR24 = 1;
    ENCODING_JPEG = 2;
    ENCODING_PNG = 3;
  }
  Encoding encoding = 1;
  bytes data = 2;
  int32 width = 3;
  int32 height = 4;
}

// 与坐标轴平行的像素框，(x1, y1) 是左上角，(x2, y2) 是右下角。
// 具体坐标系由使用这个类型的字段说明。
message BBox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

// 服务端耗时，仅用于指标统计。
message Timings {
  float total_ms = 1;
  map<string, float> stages_ms = 2;
}
